ВидЭлемента: КомпонентИнтерфейса
Ид: 4f0b37ae-0a37-4bc6-98b6-84e8a23c94cd
Имя: КарточкаЗаказаИгрока
ОбластьВидимости: ВПодсистеме
Импорт:
    - Данные
Наследует:
    Тип: ПроизвольнаяСтрокаСписка<СтрокаРынкаИгрока>
    Содержимое:
        Тип: СтандартнаяКарточка
        Заголовок: =ДанныеСтроки.Модель
        МинимальнаяВысота: 205
        РастягиватьПоГоризонтали: Истина
        Фон: =Цвета.Стилевые.ФонВторичный
        Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            Содержимое:
                -
                    Тип: Надпись
                    Важность: Низкая
                    Значение: ="ЗАКАЗ №%{ДанныеСтроки.Номер}"
                -
                    Тип: Надпись
                    Значение: '=ДанныеСтроки.Составной ? "%{ДанныеСтроки.Количество} шт. по прайс-листу ERP" : "%{ДанныеСтроки.Количество} шт. · %{ДанныеСтроки.Цена} ₽ / шт."'
                -
                    Тип: Надпись
                    Значение: ="%{ДанныеСтроки.Сумма} ₽"
                    Шрифт: =СтилевыеШрифты.ЗаголовокКрупный
                -
                    Тип: Надпись
                    Значение: =ДанныеСтроки.Статус
                    Цвет: '=ДанныеСтроки.Мой ? Цвета.Зеленый : Цвета.Голубой'
                -
                    Тип: Надпись
                    Важность: Низкая
                    Видимость: =ДанныеСтроки.СостояниеERP != ""
                    Значение: =ДанныеСтроки.СостояниеERP
                -
                    Тип: Надпись
                    Важность: Низкая
                    Значение: '=ДанныеСтроки.Свободен ? "Заказ доступен всем командам" : "Получатель: %{ДанныеСтроки.Команда}"'