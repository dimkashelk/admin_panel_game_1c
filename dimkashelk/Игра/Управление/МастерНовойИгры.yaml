ВидЭлемента: КомпонентИнтерфейса
Ид: 900c16bb-4dae-47f3-a947-46c697b2905b
Имя: МастерНовойИгры
ОбластьВидимости: ВПроекте
Импорт:
- Данные
- Обмен
Наследует:
  Тип: Форма
  РастягиватьПоГоризонтали: Истина
  ВключатьВАвтоИнтерфейс: Ложь
  ПовторноеИспользованиеФормы: Истина
  Заголовок: Новая игра
  Содержимое:
    Тип: ПроизвольныйШаблонФормы
    Содержимое:
      Тип: Группа
      Компоновка: Вертикальная
      РастягиватьПоГоризонтали: Истина
      ШиринаВКолонках: Четверная
      Содержимое:
      - Тип: Надпись
        Значение: ="Шаг 1. Укажите название и сценарий, настройте команды и нажмите «Создать игру»."
      - Тип: Надпись
        Значение: =Сообщение
        Видимость: =Сообщение != ""
      - Тип: Группа
        Компоновка: Вертикальная
        РастягиватьПоГоризонтали: Истина
        ШиринаВКолонках: Четверная
        Содержимое:
        - Тип: ПолеВвода<Строка>
          РастягиватьПоГоризонтали: Истина
          МаксимальнаяШирина: 560
          Имя: Название
          Заголовок: Название игры
          Значение: =Название
          Доступность: =не Занято и Администратор
        - Тип: ПолеВвода<СценарииИгры.Ссылка?>
          РастягиватьПоГоризонтали: Истина
          МаксимальнаяШирина: 560
          Имя: Сценарий
          Заголовок: Сценарий игры
          Значение: =Сценарий
          Доступность: =не Занято и Администратор
        - Тип: СворачиваемыйКомпонент
          Заголовок: Правила рынка и интервалы заказов
          Свернут: Истина
          РастягиватьПоГоризонтали: Истина
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            Содержимое:
            - Тип: Надпись
              Значение: '="Для первого запуска можно оставить значения по умолчанию: включён общий рынок. Персональные заказы
                по прайс-листам ERP можно выбрать после создания игры в её настройках."'
            - Тип: ПолеВвода<Число>
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Имя: Seed
              Заголовок: Число для повторения случайных результатов
              Значение: =Seed
              Доступность: =не Занято и Администратор
            - Тип: ПолеВвода<Число>
              Имя: ПроцентСпроса
              Заголовок: Спрос рынка, % доступного объёма игроков
              Значение: =ПроцентСпроса
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Доступность: =не Занято и Администратор
            - Тип: Надпись
              Значение: ="От 1 до 100%. Например, при доступных 100 шт. и спросе 80% рынок закажет 80 шт."
            - Тип: Флажок
              Имя: СвободныйРынок
              Заголовок: 'Случайные заказы: команды сами разбирают общий рынок'
              Значение: =СвободныйРынок
              Доступность: =не Занято и Администратор
            - Тип: Группа
              Заголовок: Появление заказов
              Компоновка: Вертикальная
              РастягиватьПоГоризонтали: Истина
              Видимость: =СвободныйРынок
              Содержимое:
              - Тип: ПолеВвода<Число>
                Имя: МинКоличествоЗаказа
                Заголовок: Минимум единиц в заказе
                Значение: =МинКоличествоЗаказа
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор
              - Тип: ПолеВвода<Число>
                Имя: МаксКоличествоЗаказа
                Заголовок: Максимум единиц в заказе
                Значение: =МаксКоличествоЗаказа
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор
              - Тип: ПолеВвода<Число>
                Имя: МинИнтервалЗаказов
                Заголовок: Минимальный интервал заказов, сек.
                Значение: =МинИнтервалЗаказов
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор
              - Тип: ПолеВвода<Число>
                Имя: МаксИнтервалЗаказов
                Заголовок: Максимальный интервал заказов, сек.
                Значение: =МаксИнтервалЗаказов
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор
        - Тип: Надпись
          Значение: ="Команды"
          Шрифт: =СтилевыеШрифты.ЗаголовокОбычный
        - Тип: Надпись
          Значение: ="Две команды уже добавлены. Нажмите на карандаш в строке, чтобы изменить название, игроков или базу ERP."
        - Тип: Таблица<ИсточникДанныхМассив<ВводКоманды>>
          ШиринаВКолонках: Четверная
          Имя: Команды
          РастягиватьПоГоризонтали: Истина
          ИспользоватьОтметкиСтрок: Истина
          Источник:
            Данные: =Команды
          Колонки:
          - Тип: СтандартнаяКолонкаТаблицы<ВводКоманды>
            МинимальнаяШирина: 220
            РазрешитьСжатие: Ложь
            Заголовок: Название команды
            ПолеЗначения: Наименование
            ТолькоЧтение: Истина
          - Тип: СтандартнаяКолонкаТаблицы<ВводКоманды>
            Заголовок: Игроков
            ПолеЗначения: КоличествоИгроков
            ТолькоЧтение: Истина
          КомандыСтроки:
            Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<ВводКоманды>>
            Элементы:
            - Тип: КомандаСПараметром<ВводКоманды>
              Представление: Настроить команду
              Изображение: Редактировать.svg
              Обработчик: НастроитьКоманду
              Доступность: =не Занято
          Команды:
            Тип: ФрагментКомандногоИнтерфейса
            Элементы:
            - =Компоненты.Команды.ДобавитьСтроку
          КомандыОтмеченныхСтрок:
            Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<Массив<ВводКоманды>>>
            Элементы:
            - =Компоненты.Команды.Удалить
          Доступность: =не Занято и Администратор
        Заголовок: Правила игры
  ОсновнаяКоманда:
    Тип: ОбычнаяКоманда
    Представление: Создать игру
    Обработчик: Создать
    Доступность: =не Занято и Администратор
Свойства:
- Имя: ПроцентСпроса
  Тип: Число
- Имя: Название
  Тип: Строка
- Имя: Сценарий
  Тип: СценарииИгры.Ссылка?
- Имя: Команды
  Тип: Массив<ВводКоманды>
- Имя: Seed
  Тип: Число
- Имя: СозданнаяИгра
  Тип: Игры.Ссылка?
- Имя: Сообщение
  Тип: Строка
- Имя: СвободныйРынок
  Тип: Булево
- Имя: Занято
  Тип: Булево
- Имя: Администратор
  Тип: Булево
- Имя: МинКоличествоЗаказа
  Тип: Число
- Имя: МаксКоличествоЗаказа
  Тип: Число
- Имя: МинИнтервалЗаказов
  Тип: Число
- Имя: МаксИнтервалЗаказов
  Тип: Число
