            - Тип: СворачиваемыйКомпонент
              Свернут: Истина
              Заголовок: Особые действия
              Видимость: =Состояние != Неопределено и Состояние!.Статус != СостоянияИгры.Завершена
                и Состояние!.Статус != СостоянияИгры.Отменена
              РастягиватьПоГоризонтали: Истина
              Содержимое:
                Тип: Группа
                Компоновка: Вертикальная
                РастягиватьПоГоризонтали: Истина
                ШиринаВКолонках: Четверная
                Содержимое:
                - Тип: Надпись
