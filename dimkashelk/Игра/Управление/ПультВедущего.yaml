              КомандыОтмеченныхСтрок:
                Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<Массив<ВводПредложения>>>
                Элементы:
                - =Компоненты.Предложения.Удалить
            - Тип: Кнопка
              Имя: ПринятьСнимокКнопка
              Команды:
                Тип: ОбычнаяКоманда
                Представление: Принять тестовый снимок команды
