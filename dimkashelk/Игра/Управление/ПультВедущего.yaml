                    == СостоянияИгры.Пауза)
                - Тип: Кнопка
                  Имя: ОтменитьКнопка
                  Команды:
                    Тип: ОбычнаяКоманда
                    Представление: Отменить игру
                    Обработчик: Отменить
                  Видимость: =Состояние != Неопределено и Состояние!.Статус != СостоянияИгры.Завершена
                    и Состояние!.Статус != СостоянияИгры.Отменена
                  ОпасностьДействия: Высокая
        - Тип: Страница
          Заголовок: Тестовые данные
          Содержимое:
