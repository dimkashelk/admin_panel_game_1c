ВидЭлемента: КомпонентИнтерфейса
Ид: 6f7167ac-4e79-4733-b5b2-ba8122089396
Имя: ПультВедущего
ОбластьВидимости: ВПроекте
Импорт:
- Данные
- Аналитика
- Обмен
Наследует:
  Тип: Форма
  РастягиватьПоГоризонтали: Истина
  ВключатьВАвтоИнтерфейс: Ложь
  ПовторноеИспользованиеФормы: Истина
  Заголовок: Пульт ведущего
  Содержимое:
    Тип: ПроизвольныйШаблонФормы
    Содержимое:
      Тип: Группа
      Компоновка: Вертикальная
      РастягиватьПоГоризонтали: Истина
      ШиринаВКолонках: Четверная
      Содержимое:
      - Тип: Группа
        Компоновка: Горизонтальная
        РастягиватьПоГоризонтали: Истина
        ШиринаВКолонках: Четверная
        Содержимое:
        - Тип: ПолеВвода<Игры.Ссылка?>
          РастягиватьПоГоризонтали: Истина
          МаксимальнаяШирина: 560
          Имя: Игра
          Заголовок: Игра
          Значение: =Игра
          ПриИзменении: ИграПриИзменении
        - Тип: Кнопка
          Имя: ОбновитьКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Обновить состояние
            Обработчик: Обновить
        - Тип: Кнопка
          Имя: НастроитьИгруКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Настройка этой игры
            Обработчик: НастроитьИгру
          Доступность: =Игра != Неопределено
      - Тип: Надпись
        Имя: Сводка
        Значение: =Сводка
        Шрифт: =СтилевыеШрифты.ЗаголовокОбычный
      - Тип: Надпись
        Имя: ПредупреждениеВремени
        Значение: =ПредупреждениеВремени
        Видимость: =ПредупреждениеВремени != ""
        Шрифт: =СтилевыеШрифты.ЗаголовокОбычный
      - Тип: Надпись
        Значение: =Сообщение
        Видимость: =Сообщение != ""
      - Тип: Надпись
        Значение: =СледующийШаг
      - Тип: Группа
        Компоновка: Горизонтальная
        РастягиватьПоГоризонтали: Истина
        ШиринаВКолонках: Четверная
        Содержимое:
        - Тип: Кнопка
          Имя: НачатьРынокODataКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Запустить рынок OData
            Обработчик: НачатьРынокOData
          Видимость: =Состояние != Неопределено и (Состояние!.Статус == СостоянияИгры.Черновик или Состояние!.Статус == СостоянияИгры.Подготовка)
        - Тип: Кнопка
          Имя: ПодготовитьКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Подготовить игру
            Обработчик: Подготовить
          Видимость: =Состояние != Неопределено и Состояние!.Статус == СостоянияИгры.Черновик
        - Тип: Кнопка
          Имя: НачатьКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Начать игру
            Обработчик: Начать
          Видимость: =Состояние != Неопределено и Состояние!.Статус == СостоянияИгры.Подготовка
        - Тип: Кнопка
          Имя: СледующаяФазаКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: '=Состояние != Неопределено и Состояние!.ТолькоРынок и не Состояние!.ЗаказыПоЦенамERP ? "Завершить
              раунд рынка" : "Перейти к следующей фазе"'
            Обработчик: СледующаяФаза
          Видимость: =Состояние != Неопределено и Состояние!.Статус == СостоянияИгры.Идет
        - Тип: Кнопка
          Имя: ПаузаКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Пауза
            Обработчик: Пауза
          Видимость: =Состояние != Неопределено и Состояние!.Статус == СостоянияИгры.Идет
        - Тип: Кнопка
          Имя: ВозобновитьКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Возобновить
            Обработчик: Возобновить
          Видимость: =Состояние != Неопределено и Состояние!.Статус == СостоянияИгры.Пауза
      - Тип: Надпись
        Значение: ="Готовность команд"
        Шрифт: =СтилевыеШрифты.ЗаголовокОбычный
      - Тип: Таблица<ИсточникДанныхМассив<СтрокаГотовности>>
        ШиринаВКолонках: Четверная
        Имя: Готовность
        РастягиватьПоГоризонтали: Истина
        ТолькоЧтение: Истина
        Источник:
          Данные: =Участники
        Колонки:
        - Тип: СтандартнаяКолонкаТаблицы<СтрокаГотовности>
          МинимальнаяШирина: 220
          РазрешитьСжатие: Ложь
          Заголовок: Команда
          ПолеЗначения: Команда
        - Тип: СтандартнаяКолонкаТаблицы<СтрокаГотовности>
          МинимальнаяШирина: 140
          РазрешитьСжатие: Ложь
          Заголовок: Готов
          ПолеЗначения: Готов
        - Тип: СтандартнаяКолонкаТаблицы<СтрокаГотовности>
          Заголовок: Игроки завершили
          ПолеЗначения: ИгрокЗавершил
        - Тип: СтандартнаяКолонкаТаблицы<СтрокаГотовности>
          МинимальнаяШирина: 180
          РазрешитьСжатие: Ложь
          Заголовок: Время
          ПолеЗначения: Время
        - Тип: СтандартнаяКолонкаТаблицы<СтрокаГотовности>
          МинимальнаяШирина: 280
          РазрешитьСжатие: Ложь
          Заголовок: Причина
          ПолеЗначения: Причина
      - Тип: Кнопка
        Имя: ОпубликоватьКнопка
        Команды:
          Тип: ОбычнаяКоманда
          Представление: Опубликовать результаты
          Обработчик: Опубликовать
        Видимость: =Состояние != Неопределено и не Состояние!.ТолькоРынок и Состояние!.Статус == СостоянияИгры.Завершена
      - Тип: СворачиваемыйКомпонент
        Заголовок: Проблемы обмена с ERP
        Свернут: Истина
        РастягиватьПоГоризонтали: Истина
        Видимость: =Состояние != Неопределено и ((не Состояние!.ТолькоРынок и не Состояние!.ЗаказыПоЦенамERP) или (Состояние!.ЗаказыПоЦенамERP
          и Состояние!.Фаза == ФазыИгры.Ценообразование)) и (Состояние!.Статус == СостоянияИгры.Подготовка или Состояние!.Статус
          == СостоянияИгры.Идет)
        Содержимое:
          Тип: Группа
          Компоновка: Вертикальная
          РастягиватьПоГоризонтали: Истина
          Содержимое:
          - Тип: Надпись
            Значение: Исправьте причину в таблице готовности. Затем повторите чтение ERP этой кнопкой.
          - Тип: Кнопка
            Имя: ПовторитьОбменERP
            Команды:
              Тип: ОбычнаяКоманда
              Представление: '=Состояние != Неопределено и Состояние!.ЗаказыПоЦенамERP ? "Повторить сбор прайс-листов" : "Повторить
                ошибочные задания ERP"'
              Обработчик: ПовторитьОбмен
            Видимость: =Состояние != Неопределено и ((не Состояние!.ТолькоРынок и не Состояние!.ЗаказыПоЦенамERP) или (Состояние!.ЗаказыПоЦенамERP
              и Состояние!.Фаза == ФазыИгры.Ценообразование)) и (Состояние!.Статус == СостоянияИгры.Подготовка или Состояние!.Статус
              == СостоянияИгры.Идет)
      - Тип: СворачиваемыйКомпонент
        Свернут: Истина
        Заголовок: Особые действия
        Видимость: =Состояние != Неопределено и Состояние!.Статус != СостоянияИгры.Завершена и Состояние!.Статус != СостоянияИгры.Отменена
        РастягиватьПоГоризонтали: Истина
        Содержимое:
          Тип: Группа
          Компоновка: Вертикальная
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Четверная
          Содержимое:
          - Тип: Надпись
            Значение: ="Отмена игры и исключение команды требуют причины."
          - Тип: ПолеВвода<УчастникиИгры.Ссылка?>
            РастягиватьПоГоризонтали: Истина
            МаксимальнаяШирина: 560
            Имя: Участник
            Заголовок: Команда
            Значение: =Участник
            СписокВыбора: =ПолучитьКомандыДляВыбора()
            РежимВыбораИзСписка: ТолькоЗначенияИзСпискаВыбора
            ОтображатьКомандуСоздания: Ложь
          - Тип: Кнопка
            Имя: ИсключитьУчастникаКнопка
            Команды:
              Тип: ОбычнаяКоманда
              Представление: Исключить команду
              Обработчик: ИсключитьУчастника
            ОпасностьДействия: Высокая
            Доступность: =Участник != Неопределено и Состояние != Неопределено и (Состояние!.Статус == СостоянияИгры.Идет
              или Состояние!.Статус == СостоянияИгры.Пауза)
          - Тип: Кнопка
            Имя: ОтменитьКнопка
            Команды:
              Тип: ОбычнаяКоманда
              Представление: Отменить игру
              Обработчик: Отменить
            Видимость: =Состояние != Неопределено и Состояние!.Статус != СостоянияИгры.Завершена и Состояние!.Статус != СостоянияИгры.Отменена
            ОпасностьДействия: Высокая
      - Тип: СворачиваемыйКомпонент
        Свернут: Истина
        Заголовок: Информация об игре
        РастягиватьПоГоризонтали: Истина
        Содержимое:
          Тип: Группа
          Компоновка: Вертикальная
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Четверная
          Содержимое:
          - Тип: Надпись
            Имя: ОписаниеРежима
            Значение: =ОписаниеРежима
          - Тип: Надпись
            Имя: СостояниеОбновления
            Значение: =СостояниеОбновления
