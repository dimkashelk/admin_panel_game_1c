              - Тип: Кнопка
                Имя: НачатьКнопка
                Команды:
                  Тип: ОбычнаяКоманда
                  Представление: Начать игру
                  Обработчик: Начать
                Видимость: =Состояние != Неопределено и Состояние!.Статус == СостоянияИгры.Подготовка
              - Тип: Кнопка
