                - Тип: ПолеВвода<УчастникиИгры.Ссылка?>
                  РастягиватьПоГоризонтали: Истина
                  МаксимальнаяШирина: 560
                  Имя: Участник
                  Заголовок: Команда
                  Значение: =Участник
