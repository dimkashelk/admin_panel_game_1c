ВидЭлемента: КомпонентИнтерфейса
Ид: d5854555-db72-40d6-923c-4faf0e646ecb
Имя: НастройкаИгры
ОбластьВидимости: ВПроекте
Импорт:
- Данные
- Обмен
Наследует:
  Тип: Форма
  РастягиватьПоГоризонтали: Истина
  ВключатьВАвтоИнтерфейс: Ложь
  ПовторноеИспользованиеФормы: Ложь
  Заголовок: Настройка игры
  Содержимое:
    Тип: ПроизвольныйШаблонФормы
    Содержимое:
      Тип: Группа
      Компоновка: Вертикальная
      РастягиватьПоГоризонтали: Истина
      ШиринаВКолонках: Четверная
      Содержимое:
      - Тип: Надпись
        Значение: ="Шаг 2. Настройте игроков и базу ERP каждой команды. Сохраните изменённые правила и перейдите к пульту."
      - Тип: Группа
        Компоновка: Вертикальная
        РастягиватьПоГоризонтали: Истина
        Содержимое:
        - Тип: ПолеВвода<Игры.Ссылка?>
          Имя: СозданнаяИгра
          Заголовок: Выберите игру
          Значение: =СозданнаяИгра
          РастягиватьПоГоризонтали: Истина
          МаксимальнаяШирина: 560
          ПриИзменении: ИграИзменена
          Доступность: =не Занято
          ОтображатьКомандуСоздания: Ложь
        Заголовок: Игра
      - Тип: Надпись
        Значение: =СтатусИгры
        Шрифт: =СтилевыеШрифты.ЗаголовокОбычный
      - Тип: Надпись
        Значение: =Сообщение
        Видимость: =Сообщение != ""
      - Тип: Группа
        Компоновка: Вертикальная
        РастягиватьПоГоризонтали: Истина
        ШиринаВКолонках: Четверная
        Содержимое:
        - Тип: ПолеВвода<Строка>
          РастягиватьПоГоризонтали: Истина
          МаксимальнаяШирина: 560
          Имя: Название
          Заголовок: Название игры
          Значение: =Название
          Доступность: =не Занято и Черновик и Администратор
        - Тип: ПолеВвода<СценарииИгры.Ссылка?>
          РастягиватьПоГоризонтали: Истина
          МаксимальнаяШирина: 560
          Имя: Сценарий
          Заголовок: Сценарий игры
          Значение: =Сценарий
          Доступность: =не Занято и Черновик и Администратор
        - Тип: СворачиваемыйКомпонент
          Заголовок: Правила рынка и интервалы заказов
          Свернут: Истина
          РастягиватьПоГоризонтали: Истина
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            Содержимое:
            - Тип: Надпись
              Значение: ="Для первого запуска можно оставить значения по умолчанию. Общий рынок и заказы по прайс-листам ERP
                — разные режимы; выберите один."
            - Тип: ПолеВвода<Число>
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Имя: Seed
              Заголовок: Число для повторения случайных результатов
              Значение: =Seed
              Доступность: =не Занято и Черновик и Администратор
            - Тип: Флажок
              Имя: ЗаказыПоЦенамERP
              Заголовок: 'Заказы по прайс-листам ERP: один персональный заказ каждой команде'
              Значение: =ЗаказыПоЦенамERP
              Доступность: =не Занято и Черновик и Администратор и не СвободныйРынок
            - Тип: Флажок
              Имя: СвободныйРынок
              Заголовок: 'Случайные заказы: команды сами разбирают общий рынок'
              Значение: =СвободныйРынок
              Доступность: =не Занято и Черновик и Администратор и не ЗаказыПоЦенамERP
            - Тип: Группа
              Заголовок: Появление заказов
              Компоновка: Вертикальная
              РастягиватьПоГоризонтали: Истина
              Видимость: =СвободныйРынок
              Содержимое:
              - Тип: ПолеВвода<Число>
                Имя: МинКоличествоЗаказа
                Заголовок: Минимум единиц в заказе
                Значение: =МинКоличествоЗаказа
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор и Черновик
              - Тип: ПолеВвода<Число>
                Имя: МаксКоличествоЗаказа
                Заголовок: Максимум единиц в заказе
                Значение: =МаксКоличествоЗаказа
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор и Черновик
              - Тип: ПолеВвода<Число>
                Имя: МинИнтервалЗаказов
                Заголовок: Минимальный интервал заказов, сек.
                Значение: =МинИнтервалЗаказов
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор и Черновик
              - Тип: ПолеВвода<Число>
                Имя: МаксИнтервалЗаказов
                Заголовок: Максимальный интервал заказов, сек.
                Значение: =МаксИнтервалЗаказов
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор и Черновик
        - Тип: Кнопка
          Имя: СохранитьИгруКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Сохранить настройки игры
            Обработчик: СохранитьИгру
          Доступность: =не Занято и Черновик и Администратор
          Видимость: =ЗагруженнаяИгра != Неопределено
        - Тип: Надпись
          Значение: ="После подготовки правила и состав игры зафиксированы."
          Видимость: =не Черновик
        Заголовок: Правила игры
        Видимость: =ЗагруженнаяИгра != Неопределено и ЗагруженнаяИгра == СозданнаяИгра
      - Тип: Группа
        Компоновка: Вертикальная
        РастягиватьПоГоризонтали: Истина
        ШиринаВКолонках: Четверная
        Видимость: =ЗагруженнаяИгра != Неопределено и ЗагруженнаяИгра == СозданнаяИгра
        Содержимое:
        - Тип: Надпись
          Значение: ="Команды игры"
          Шрифт: =СтилевыеШрифты.ЗаголовокОбычный
          Видимость: =СозданнаяИгра != Неопределено
        - Тип: Надпись
          Значение: ="Нажмите на карандаш в строке, чтобы изменить название, игроков или базу ERP команды."
          Видимость: =СозданнаяИгра != Неопределено
        - Тип: Таблица<ИсточникДанныхМассив<КомандаКабинета>>
          Имя: Команды
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Четверная
          Источник:
            Данные: =СписокКоманд
          Колонки:
          - Тип: СтандартнаяКолонкаТаблицы<КомандаКабинета>
            Заголовок: Наименование
            ПолеЗначения: Представление
            ТолькоЧтение: Истина
          КомандыСтроки:
            Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<КомандаКабинета>>
            Элементы:
            - Тип: КомандаСПараметром<КомандаКабинета>
              Представление: Редактировать команду
              Изображение: Редактировать.svg
              Обработчик: НастроитьСохраненнуюКоманду
              Доступность: =не Занято
          Команды:
            Тип: ФрагментКомандногоИнтерфейса
            Элементы:
            - Тип: ОбычнаяКоманда
              Представление: Добавить команду
              Обработчик: ДобавитьКоманду
              Доступность: =не Занято и Черновик и Администратор
        - Тип: Кнопка
          Имя: ОткрытьПультКнопка
          Видимость: =СозданнаяИгра != Неопределено
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Перейти к пульту этой игры
            Обработчик: ОткрытьПульт
          Доступность: =не Занято
        - Тип: СворачиваемыйКомпонент
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Четверная
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            Содержимое:
            - Тип: Надпись
              Значение: ="Права ведущих и наблюдателей, HTTP-сервис ERP, соответствия номенклатуры и профиль игры."
            - Тип: Кнопка
              Имя: РасширенныеНастройкиКнопка
              Команды:
                Тип: ОбычнаяКоманда
                Представление: Открыть расширенные настройки игры
                Обработчик: РасширенныеНастройки
              Доступность: =не Занято
          Заголовок: Дополнительные настройки
          Видимость: =СозданнаяИгра != Неопределено
          Свернут: Истина
  ОбычныеКоманды:
    Тип: ФрагментКомандногоИнтерфейса
    Элементы:
    - Тип: ОбычнаяКоманда
      Представление: Обновить настройки
      Обработчик: ОбновитьНастройки
      Доступность: =не Занято и СозданнаяИгра != Неопределено
