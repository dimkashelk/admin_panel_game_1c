ВидЭлемента: КомпонентИнтерфейса
Ид: d5854555-db72-40d6-923c-4faf0e646ecb
Имя: НастройкаИгры
ОбластьВидимости: ВПроекте
Импорт:
- Данные
- Обмен
Наследует:
  Тип: Форма
  РастягиватьПоГоризонтали: Истина
  ВключатьВАвтоИнтерфейс: Ложь
  ПовторноеИспользованиеФормы: Ложь
  Заголовок: '=СозданнаяИгра == Неопределено ? "Новая игра" : Название'
  Содержимое:
    Тип: ПроизвольныйШаблонФормы
    Содержимое:
      Тип: Группа
      Компоновка: Вертикальная
      РастягиватьПоГоризонтали: Истина
      ШиринаВКолонках: Четверная
      Содержимое:
      - Тип: Надпись
        Значение: =СтатусИгры
        Шрифт: =СтилевыеШрифты.ЗаголовокОбычный
        Видимость: =СозданнаяИгра != Неопределено
      - Тип: Группа
        Компоновка: Вертикальная
        РастягиватьПоГоризонтали: Истина
        ШиринаВКолонках: Четверная
        Содержимое:
        - Тип: ПолеВвода<Строка>
          РастягиватьПоГоризонтали: Истина
          МаксимальнаяШирина: 560
          Имя: Название
          Заголовок: Название игры
          Значение: =Название
          Доступность: =не Занято и (СозданнаяИгра == Неопределено или Черновик) и Администратор
        - Тип: ПолеВвода<СценарииИгры.Ссылка?>
          РастягиватьПоГоризонтали: Истина
          МаксимальнаяШирина: 560
          Имя: Сценарий
          Заголовок: Сценарий игры
          Значение: =Сценарий
          Доступность: =не Занято и Администратор и (СозданнаяИгра == Неопределено или Черновик) и не ОжидаласьПодготовка
        - Тип: СворачиваемыйКомпонент
          Заголовок: Правила рынка и интервалы заказов
          Свернут: Истина
          РастягиватьПоГоризонтали: Истина
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            Содержимое:
            - Тип: ПолеВвода<Число>
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Имя: Seed
              Заголовок: Число для повторения случайных результатов
              Значение: =Seed
              Доступность: =не Занято и Администратор и (СозданнаяИгра == Неопределено или Черновик) и не ОжидаласьПодготовка
            - Тип: ПолеВвода<Число>
              Имя: ПроцентСпроса
              Заголовок: Спрос рынка, % доступного объёма игроков
              Значение: =ПроцентСпроса
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Доступность: =не Занято и (СозданнаяИгра == Неопределено или Черновик) и Администратор
            - Тип: Флажок
              Имя: ЗаказыПоЦенамERP
              Заголовок: 'Заказы по прайс-листам ERP: один персональный заказ каждой команде'
              Значение: =ЗаказыПоЦенамERP
              Доступность: =не Занято и (СозданнаяИгра == Неопределено или Черновик) и Администратор и не СвободныйРынок
            - Тип: Флажок
              Имя: СвободныйРынок
              Заголовок: 'Случайные заказы: команды сами разбирают общий рынок'
              Значение: =СвободныйРынок
              Доступность: =не Занято и (СозданнаяИгра == Неопределено или Черновик) и Администратор и не ЗаказыПоЦенамERP
            - Тип: Группа
              Заголовок: Появление заказов
              Компоновка: Вертикальная
              РастягиватьПоГоризонтали: Истина
              Видимость: =СвободныйРынок
              Содержимое:
              - Тип: ПолеВвода<Число>
                Имя: МинКоличествоЗаказа
                Заголовок: Минимум единиц в заказе
                Значение: =МинКоличествоЗаказа
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор и (СозданнаяИгра == Неопределено или Черновик)
              - Тип: ПолеВвода<Число>
                Имя: МаксКоличествоЗаказа
                Заголовок: Максимум единиц в заказе
                Значение: =МаксКоличествоЗаказа
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор и (СозданнаяИгра == Неопределено или Черновик)
              - Тип: ПолеВвода<Число>
                Имя: МинИнтервалЗаказов
                Заголовок: Минимальный интервал заказов, сек.
                Значение: =МинИнтервалЗаказов
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор и (СозданнаяИгра == Неопределено или Черновик)
              - Тип: ПолеВвода<Число>
                Имя: МаксИнтервалЗаказов
                Заголовок: Максимальный интервал заказов, сек.
                Значение: =МаксИнтервалЗаказов
                РастягиватьПоГоризонтали: Истина
                МаксимальнаяШирина: 360
                Доступность: =не Занято и Администратор и (СозданнаяИгра == Неопределено или Черновик)
        Заголовок: Правила игры
      - Тип: Группа
        Заголовок: Команды
        Компоновка: Вертикальная
        Видимость: =СозданнаяИгра == Неопределено
        Содержимое:
        - Тип: Таблица<ИсточникДанныхМассив<ВводКоманды>>
          Имя: НовыеКоманды
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Четверная
          ИспользоватьОтметкиСтрок: Истина
          Источник:
            Данные: =НовыеКоманды
          Колонки:
          - Тип: СтандартнаяКолонкаТаблицы<ВводКоманды>
            Заголовок: Наименование
            ПолеЗначения: Наименование
            ТолькоЧтение: Истина
          - Тип: СтандартнаяКолонкаТаблицы<ВводКоманды>
            Заголовок: Игроков
            ПолеЗначения: КоличествоИгроков
            ТолькоЧтение: Истина
          КомандыСтроки:
            Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<ВводКоманды>>
            Элементы:
            - Тип: КомандаСПараметром<ВводКоманды>
              Представление: Редактировать команду
              Изображение: Редактировать.svg
              Обработчик: НастроитьНовуюКоманду
          Команды:
            Тип: ФрагментКомандногоИнтерфейса
            Элементы:
            - =Компоненты.НовыеКоманды.ДобавитьСтроку
          КомандыОтмеченныхСтрок:
            Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<Массив<ВводКоманды>>>
            Элементы:
            - =Компоненты.НовыеКоманды.Удалить
          Доступность: =не Занято и Администратор
      - Тип: Группа
        Компоновка: Вертикальная
        РастягиватьПоГоризонтали: Истина
        ШиринаВКолонках: Четверная
        Видимость: =ЗагруженнаяИгра != Неопределено и ЗагруженнаяИгра == СозданнаяИгра
        Содержимое:
        - Тип: Таблица<ИсточникДанныхМассив<КомандаКабинета>>
          Имя: Команды
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Четверная
          Источник:
            Данные: =СписокКоманд
          Колонки:
          - Тип: СтандартнаяКолонкаТаблицы<КомандаКабинета>
            Заголовок: Наименование
            ПолеЗначения: Представление
            ТолькоЧтение: Истина
          КомандыСтроки:
            Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<КомандаКабинета>>
            Элементы:
            - Тип: КомандаСПараметром<КомандаКабинета>
              Представление: Редактировать команду
              Изображение: Редактировать.svg
              Обработчик: НастроитьСохраненнуюКоманду
              Доступность: =не Занято
          Команды:
            Тип: ФрагментКомандногоИнтерфейса
            Элементы:
            - Тип: ОбычнаяКоманда
              Представление: Добавить команду
              Обработчик: ДобавитьКоманду
              Доступность: =не Занято и (СозданнаяИгра == Неопределено или Черновик) и Администратор
        - Тип: Кнопка
          Имя: ОткрытьПультКнопка
          Видимость: =СозданнаяИгра != Неопределено
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Перейти к пульту этой игры
            Обработчик: ОткрытьПульт
          Доступность: =не Занято
        - Тип: СворачиваемыйКомпонент
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Четверная
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            Содержимое:
            - Тип: Кнопка
              Имя: РасширенныеНастройкиКнопка
              Команды:
                Тип: ОбычнаяКоманда
                Представление: Открыть расширенные настройки игры
                Обработчик: РасширенныеНастройки
              Доступность: =не Занято
          Заголовок: Дополнительные настройки
          Видимость: =СозданнаяИгра != Неопределено
          Свернут: Истина
      - Тип: СворачиваемыйКомпонент
        Заголовок: Информационные базы
        Свернут: Истина
        РастягиватьПоГоризонтали: Истина
        Содержимое:
          Тип: Группа
          Компоновка: Вертикальная
          Содержимое:
          - Тип: Флажок
            Имя: ДонастраиватьБазыERP
            Заголовок: Донастроить недостающие данные ERP
            Значение: =ДонастраиватьБазыERP
            Доступность: =не Занято и Администратор и (СозданнаяИгра == Неопределено или Черновик) и не ОжидаласьПодготовка
          - Тип: Кнопка
            Имя: НастроитьБазыКнопка
            Команды:
              Тип: ОбычнаяКоманда
              Представление: Проверить базы
              Обработчик: НастроитьБазы
            Видимость: =СозданнаяИгра != Неопределено
            Доступность: =не Занято и Черновик и Администратор и не ОжидаласьПодготовка
          - Тип: ПолеВвода<Строка>
            Имя: СостояниеПодготовкиБаз
            Заголовок: Состояние баз
            Значение: =СостояниеПодготовкиБаз
            ТолькоЧтение: Истина
            НастройкиВводаСтроки:
              Многострочная: Истина
            Видимость: =СозданнаяИгра != Неопределено
            РастягиватьПоГоризонтали: Истина
  ОсновнаяКоманда:
    Тип: ОбычнаяКоманда
    Представление: '=СозданнаяИгра == Неопределено ? "Создать" : "Сохранить"'
    Обработчик: СохранитьИгру
    Доступность: =не Занято и Администратор и (СозданнаяИгра == Неопределено или Черновик)
