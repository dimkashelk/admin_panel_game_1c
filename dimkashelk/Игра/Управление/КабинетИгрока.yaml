ВидЭлемента: КомпонентИнтерфейса
Ид: b7d771e1-45f1-4d53-8da9-16c981b86d5d
Имя: КабинетИгрока
ОбластьВидимости: ВПроекте
Импорт:
- Данные
Наследует:
  Тип: Форма
  Заголовок: Кабинет игрока
  ВключатьВАвтоИнтерфейс: Ложь
  ПовторноеИспользованиеФормы: Истина
  Содержимое:
    Тип: ПроизвольныйШаблонФормы
    РастягиватьПоГоризонтали: Истина
    ШиринаВКолонках: Неограниченная
    Содержимое:
      Тип: Группа
      Компоновка: Вертикальная
      Содержимое:
      - Тип: Группа
        Компоновка: Горизонтальная
        Содержимое:
        - Тип: ПолеВвода<УчастникиИгры.Ссылка?>
          Имя: Участник
          Значение: =Участник
          Заголовок: Команда
          РастягиватьПоГоризонтали: Истина
          МинимальнаяШирина: 260
          ПриИзменении: КомандаИзменена
          МаксимальнаяШирина: 360
          Доступность: =не Занято
          СписокВыбора: =ПолучитьКомандыДляВыбора()
          РежимВыбораИзСписка: ТолькоЗначенияИзСпискаВыбора
          ОтображатьКомандуСоздания: Ложь
        - Тип: Кнопка
          Имя: ОбновитьКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Обновить
            Обработчик: Обновить
      - Тип: СтандартнаяКарточка
        Заголовок: =ЗаголовокКабинета
        Содержимое:
          Тип: Группа
          Компоновка: Вертикальная
          Содержимое:
          - Тип: Надпись
            Значение: =Подзаголовок
          - Тип: Надпись
            Значение: =Таймер
            Шрифт: =СтилевыеШрифты.ЗаголовокКрупный
        РастягиватьПоГоризонтали: Истина
        МинимальнаяВысота: 145
        Фон: =Цвета.Стилевые.ФонВторичный
        Картинка:
          Тип: Картинка
          Изображение: Задачи.svg
          Цвет: =Цвета.Голубой
      - Тип: Надпись
        Значение: =ПодсказкаИгроку
      - Тип: Надпись
        Значение: =Сообщение
        Видимость: =Сообщение != ""
      - Тип: СтандартнаяКарточка
        Заголовок: Рекомендуемые цены
        Видимость: =Состояние != Неопределено и Состояние!.ЗаказыПоЦенамERP
        РастягиватьПоГоризонтали: Истина
        Содержимое:
          Тип: Надпись
          Значение: '=Состояние == Неопределено ? "" : Состояние!.РекомендуемыеЦены'
      - Тип: Страницы
        РастягиватьПоГоризонтали: Истина
        Страницы:
        - Тип: Страница
          Заголовок: Рынок
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            Содержимое:
              - Тип: Группа
                Компоновка: Бенто
                РастягиватьПоГоризонтали: Истина
                Содержимое:
                - Тип: СтандартнаяКарточка
                  Заголовок: Свободные заказы
                  Видимость: =Состояние == Неопределено или не Состояние!.ЗаказыПоЦенамERP
                  Содержимое:
                    Тип: Надпись
                    Значение: ="%{Свободных}"
                    Шрифт: =СтилевыеШрифты.ЗаголовокКрупный
                  РастягиватьПоГоризонтали: Истина
                  ШиринаВКолонках: Двойная
                - Тип: СтандартнаяКарточка
                  Заголовок: Мои заказы за раунд
                  Содержимое:
                    Тип: Группа
                    Компоновка: Вертикальная
                    Содержимое:
                    - Тип: Надпись
                      Значение: ="Всего · %{МоихЗаказов} на %{МояСумма} ₽"
                    - Тип: Надпись
                      Значение: ="Не зачтены · %{НезакрытыхЗаказов}"
                      Шрифт: =СтилевыеШрифты.ЗаголовокОбычный
                    - Тип: Надпись
                      Значение: ="Зачтены закрытыми · %{ЗакрытыхЗаказов}"
                  РастягиватьПоГоризонтали: Истина
                  ШиринаВКолонках: Двойная
                Видимость: =Состояние != Неопределено
              - Тип: Надпись
                Значение: '=Состояние != Неопределено и Состояние!.ЗаказыПоЦенамERP ? "Персональный заказ команды" : "Рынок
                  заказов"'
                Шрифт: =СтилевыеШрифты.ЗаголовокОбычный
              - Тип: Надпись
                Значение: =СостояниеРынка
                Важность: Низкая
              - Тип: Группа
                Компоновка: Горизонтальная
                Содержимое:
                - Тип: Кнопка
                  Имя: СвободныеКнопка
                  Видимость: =Состояние == Неопределено или не Состояние!.ЗаказыПоЦенамERP
                  Команды:
                    Тип: ОбычнаяКоманда
                    Представление: Свободные
                    Обработчик: ПоказатьСвободные
                - Тип: Кнопка
                  Имя: МоиКнопка
                  Команды:
                    Тип: ОбычнаяКоманда
                    Представление: Мои заказы
                    Обработчик: ПоказатьМои
                - Тип: Кнопка
                  Имя: ВсеКнопка
                  Команды:
                    Тип: ОбычнаяКоманда
                    Представление: Все заказы
                    Обработчик: ПоказатьВсе
              - Тип: Надпись
                Значение: '="Показаны: %{Фильтр}"'
                Важность: Низкая
              - Тип: ПроизвольныйСписок<ИсточникДанныхМассив<СтрокаРынкаИгрока>>
                Имя: СписокЗаказов
                Источник:
                  Данные: =Рынок
                ТипКомпонентаСтроки: КарточкаЗаказаИгрока
                ПриНажатииСтроки: ЗаказВыбран
                ИспользованиеПоиска: Ложь
                РастягиватьПоГоризонтали: Истина
                КонтейнерСтрок:
                  Тип: Группа
                  Компоновка: Матричная
                  РастягиватьПоГоризонтали: Истина
                  НастройкиМатричнойКомпоновки:
                    АвтоЗаполнение: ДобавлятьКолонкиИСтроки
                    ОписаниеАвтоматическихКолонок:
                      МинимальнаяШирина: 260
                      РастягиватьПоГоризонтали: Истина
                    ОписаниеАвтоматическихСтрок:
                      РастягиватьПоВертикали: Ложь
              - Тип: Надпись
                Значение: '=Состояние == Неопределено ? "Назначенный игрок увидит здесь заказы своей игры." : (ВсеЗаказы.Размер()
                  > 0 ? "По выбранному фильтру заказов нет. Попробуйте «Все заказы»." : (Состояние!.Статус == СостоянияИгры.Завершена
                  или Состояние!.Статус == СостоянияИгры.Отменена ? "В этом раунде нет заказов. Игра окончена." : (Состояние!.ЗаказыПоЦенамERP
                  ? "Заказ появится после установки цен всеми командами и перехода ведущего к продажам. Если цены всех моделей выше максимума, заказ не формируется: количество равно 0." : "Заказов пока
                  нет. Дождитесь открытия продаж ведущим.")))'
                Видимость: =Рынок.Размер() == 0
                Важность: Низкая
              - Тип: СтандартнаяКарточка
                Заголовок: '=ВыбранныйЗаказ == Неопределено ? "Заказ" : "Заказ №%{ВыбранныйЗаказ!.Номер}"'
                Содержимое:
                  Тип: Группа
                  Компоновка: Вертикальная
                  Содержимое:
                  - Тип: Надпись
                    Значение: '=ВыбранныйЗаказ == Неопределено ? "" : "%{ВыбранныйЗаказ!.Модель} · %{ВыбранныйЗаказ!.Количество}
                      шт. · %{ВыбранныйЗаказ!.Сумма} ₽"'
                  - Тип: Надпись
                    Значение: '=ВыбранныйЗаказ == Неопределено ? "" : ВыбранныйЗаказ!.Описание'
                  - Тип: Надпись
                    Значение: '=ВыбранныйЗаказ == Неопределено ? "" : "Получатель: %{ВыбранныйЗаказ!.Команда}. %{ВыбранныйЗаказ!.Статус}"'
                  - Тип: Надпись
                    Значение: '=ВыбранныйЗаказ == Неопределено ? "" : ВыбранныйЗаказ!.СостояниеERP'
                    Важность: Низкая
                  - Тип: Кнопка
                    Имя: ПолучитьКнопка
                    Команды:
                      Тип: ОбычнаяКоманда
                      Представление: Подтвердить заказ
                      Обработчик: ПолучитьЗаказ
                      Доступность: =ВыбранныйЗаказ != Неопределено и ВыбранныйЗаказ!.МожноПолучить и не Занято
                      Важность: Высокая
                  - Тип: Кнопка
                    Имя: ЗакрытьЗаказКнопка
                    Команды:
                      Тип: ОбычнаяКоманда
                      Представление: Закрыть заказ
                      Обработчик: ЗакрытьЗаказ
                      Доступность: =ВыбранныйЗаказ != Неопределено и ВыбранныйЗаказ!.МожноЗакрыть и не Занято
                      Важность: Высокая
                  - Тип: Надпись
                    Значение: ="Отгрузите весь заказ в ERP и нажмите «Закрыть заказ». При завершении этапа выполненные заказы также закрываются и оплачиваются автоматически."
                    Видимость: =ВыбранныйЗаказ != Неопределено и ВыбранныйЗаказ!.Мой
                    Важность: Низкая
                РастягиватьПоГоризонтали: Истина
                Видимость: =ВыбранныйЗаказ != Неопределено
              - Тип: СворачиваемыйКомпонент
                Заголовок: Подробности раунда и другие команды
                Свернут: Истина
                РастягиватьПоГоризонтали: Истина
                Содержимое:
                  Тип: Группа
                  Компоновка: Вертикальная
                  РастягиватьПоГоризонтали: Истина
                  Содержимое:
                  - Тип: ПанельЭтапов<ФазыИгры>
                    Имя: ПанельЭтаповИгры
                    Ориентация: Горизонтальная
                    РастягиватьПоГоризонтали: Истина
                    Этапы: =ЭтапыРаунда()
                    ТекущийЭтап: =Фаза
                    Доступность: Ложь
                    Видимость: =Состояние != Неопределено
                  - Тип: Надпись
                    Значение: '="После полной отгрузки нажмите «Закрыть заказ»: ERP подтвердит закрытие и поступление безналичных ДС, проведённое банком. Статусы проверяются автоматически."'
                    Важность: Низкая
                  - Тип: Надпись
                    Значение: ="Зачтено · %{ЗакрытаяСумма} ₽. Не зачтено · %{НезакрытаяСумма} ₽. Готовы команд · %{ГотовыхКоманд}."
                  - Тип: Группа
                    Компоновка: Горизонтальная
                    РастягиватьПоГоризонтали: Истина
                    Содержимое:
                    - Тип: Кнопка
                      Команды:
                        Тип: ОбычнаяКоманда
                        Представление: Мои незакрытые
                        Обработчик: ПоказатьНезакрытые
                    - Тип: Кнопка
                      Команды:
                        Тип: ОбычнаяКоманда
                        Представление: Мои закрытые
                        Обработчик: ПоказатьЗакрытые
                  - Тип: СтандартнаяКарточка
                    Заголовок: Другие команды
                    Содержимое:
                      Тип: Таблица<ИсточникДанныхМассив<СтрокаКомандыИгрока>>
                      Имя: ТаблицаКоманд
                      Источник:
                        Данные: =Команды
                      РастягиватьПоГоризонтали: Истина
                      Колонки:
                      - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
                        Заголовок: Команда
                        ПолеЗначения: Команда
                      - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
                        Заголовок: Этап
                        ПолеЗначения: Готовность
                      - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
                        Заголовок: Не закрыты
                        ПолеЗначения: НезакрытыхЗаказов
                      - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
                        Заголовок: Закрыты
                        ПолеЗначения: ЗакрытыхЗаказов
                      - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
                        Заголовок: Незакрытый портфель, ₽
                        ПолеЗначения: НезакрытыйПортфель
                      - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
                        Заголовок: Закрытый портфель, ₽
                        ПолеЗначения: ЗакрытыйПортфель
                    РастягиватьПоГоризонтали: Истина
                    ШиринаВКолонках: Двойная
        - Тип: Страница
          Заголовок: Готовность вашей команды
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            Содержимое:
              - Тип: СтандартнаяКарточка
                Заголовок: Готовность вашей команды
                Содержимое:
                  Тип: Группа
                  Компоновка: Вертикальная
                  Содержимое:
                  - Тип: Надпись
                    Значение: =ТекстГотовности
                  - Тип: СворачиваемыйКомпонент
                    Заголовок: Добавить комментарий
                    Свернут: Истина
                    РастягиватьПоГоризонтали: Истина
                    Содержимое:
                      Тип: Группа
                      Компоновка: Вертикальная
                      РастягиватьПоГоризонтали: Истина
                      Содержимое:
                      - Тип: ПолеВвода<Строка>
                        Имя: Комментарий
                        Значение: =Комментарий
                        Заголовок: Комментарий ведущему (необязательно)
                        НастройкиВводаСтроки:
                          Многострочная: Истина
                        Доступность: =Состояние != Неопределено и Состояние!.МожноЗавершить и не Занято
                  - Тип: Кнопка
                    Имя: ГотовоКнопка
                    Команды:
                      Тип: ОбычнаяКоманда
                      Представление: '=Фаза == ФазыИгры.Подготовка ? "Завершить подготовку" : "Завершить этап"'
                      Обработчик: ЗавершитьЭтап
                      Доступность: =Состояние != Неопределено и Состояние!.МожноЗавершить и не Занято
                      Важность: Высокая
                РастягиватьПоГоризонтали: Истина
                ШиринаВКолонках: Четверная
      - Тип: Надпись
        Значение: =Обновлено
        Важность: Низкая
      РастягиватьПоГоризонтали: Истина
      ШиринаВКолонках: Четверная
Свойства:
- Имя: Участник
  Тип: УчастникиИгры.Ссылка?
- Имя: Состояние
  Тип: СостояниеКабинета?
- Имя: Рынок
  Тип: Массив<СтрокаРынкаИгрока>
- Имя: ВсеЗаказы
  Тип: Массив<СтрокаРынкаИгрока>
- Имя: Команды
  Тип: Массив<СтрокаКомандыИгрока>
- Имя: Фаза
  Тип: ФазыИгры
- Имя: ВыбранныйЗаказ
  Тип: СтрокаРынкаИгрока?
- Имя: Токен
  Тип: Строка
- Имя: ЗаголовокКабинета
  Тип: Строка
- Имя: Подзаголовок
  Тип: Строка
- Имя: Таймер
  Тип: Строка
- Имя: Свободных
  Тип: Число
- Имя: МоихЗаказов
  Тип: Число
- Имя: МояСумма
  Тип: Число
- Имя: ЗакрытыхЗаказов
  Тип: Число
- Имя: НезакрытыхЗаказов
  Тип: Число
- Имя: ЗакрытаяСумма
  Тип: Число
- Имя: НезакрытаяСумма
  Тип: Число
- Имя: ГотовыхКоманд
  Тип: Строка
- Имя: ТекстГотовности
  Тип: Строка
- Имя: Комментарий
  Тип: Строка
