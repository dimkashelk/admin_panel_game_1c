ВидЭлемента: КомпонентИнтерфейса
Ид: b7d771e1-45f1-4d53-8da9-16c981b86d5d
Имя: КабинетИгрока
ОбластьВидимости: ВПроекте
Импорт:
- Данные
Наследует:
  Тип: Форма
  Заголовок: Кабинет игрока
  ВключатьВАвтоИнтерфейс: Ложь
  ПовторноеИспользованиеФормы: Истина
  Содержимое:
    Тип: ПроизвольныйШаблонФормы
    РастягиватьПоГоризонтали: Истина
    ШиринаВКолонках: Неограниченная
    Содержимое:
      Тип: Группа
      Компоновка: Вертикальная
      Содержимое:
      - Тип: Группа
        Компоновка: Горизонтальная
        Содержимое:
        - Тип: ПолеВвода<УчастникиИгры.Ссылка?>
          Имя: Участник
          Значение: =Участник
          Заголовок: Команда
          РастягиватьПоГоризонтали: Истина
          МинимальнаяШирина: 260
          ПриИзменении: КомандаИзменена
          МаксимальнаяШирина: 360
          Доступность: =не Занято
          СписокВыбора: =ПолучитьКомандыДляВыбора()
          РежимВыбораИзСписка: ТолькоЗначенияИзСпискаВыбора
          ОтображатьКомандуСоздания: Ложь
        - Тип: Кнопка
          Имя: ОбновитьКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Обновить
            Обработчик: Обновить
      - Тип: СтандартнаяКарточка
        Заголовок: =ЗаголовокКабинета
        Содержимое:
          Тип: Группа
          Компоновка: Вертикальная
          Содержимое:
          - Тип: Надпись
            Значение: =Подзаголовок
          - Тип: Надпись
            Значение: =Таймер
            Шрифт: =СтилевыеШрифты.ЗаголовокКрупный
        РастягиватьПоГоризонтали: Истина
        МинимальнаяВысота: 145
        Фон: =Цвета.Стилевые.ФонВторичный
        Картинка:
          Тип: Картинка
          Изображение: Задачи.svg
          Цвет: =Цвета.Голубой
      - Тип: ПанельЭтапов<ФазыИгры>
        Имя: ПанельЭтаповИгры
        Ориентация: Горизонтальная
        РастягиватьПоГоризонтали: Истина
        ТекущийЭтап: =Фаза
        Доступность: Ложь
        Видимость: =Состояние != Неопределено
      - Тип: Группа
        Компоновка: Бенто
        РастягиватьПоГоризонтали: Истина
        Содержимое:
        - Тип: СтандартнаяКарточка
          Заголовок: Свободные заказы
          Видимость: =Состояние == Неопределено или не Состояние!.ЗаказыПоЦенамERP
          Содержимое:
            Тип: Надпись
            Значение: ="%{Свободных}"
            Шрифт: =СтилевыеШрифты.ЗаголовокКрупный
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Одинарная
        - Тип: СтандартнаяКарточка
          Заголовок: Заказы — зачёт раунда
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            Содержимое:
            - Тип: Надпись
              Значение: ="Не зачтены · %{НезакрытыхЗаказов}"
              Шрифт: =СтилевыеШрифты.ЗаголовокКрупный
            - Тип: Надпись
              Значение: ="Зачтены закрытыми · %{ЗакрытыхЗаказов}"
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Одинарная
        - Тип: СтандартнаяКарточка
          Заголовок: Портфель — зачёт раунда
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            Содержимое:
            - Тип: Надпись
              Значение: ="Не зачтено · %{НезакрытаяСумма} ₽"
              Шрифт: =СтилевыеШрифты.ЗаголовокКрупный
            - Тип: Надпись
              Значение: ="Зачтено · %{ЗакрытаяСумма} ₽"
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Одинарная
        - Тип: СтандартнаяКарточка
          Заголовок: Готовность команд
          Содержимое:
            Тип: Надпись
            Значение: =ГотовыхКоманд
            Шрифт: =СтилевыеШрифты.ЗаголовокКрупный
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Одинарная
        Видимость: =Состояние != Неопределено
      - Тип: Надпись
        Значение: '=Состояние != Неопределено и Состояние!.ЗаказыПоЦенамERP ? "Персональный заказ команды" : "Рынок заказов"'
        Шрифт: =СтилевыеШрифты.ЗаголовокОбычный
      - Тип: Надпись
        Значение: =СостояниеРынка
        Важность: Низкая
      - Тип: Группа
        Компоновка: Горизонтальная
        Содержимое:
        - Тип: Кнопка
          Имя: ВсеКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Все заказы
            Обработчик: ПоказатьВсе
        - Тип: Кнопка
          Имя: СвободныеКнопка
          Видимость: =Состояние == Неопределено или не Состояние!.ЗаказыПоЦенамERP
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Свободные
            Обработчик: ПоказатьСвободные
        - Тип: Кнопка
          Имя: МоиКнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Мои заказы
            Обработчик: ПоказатьМои
        - Тип: Кнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Мои незакрытые
            Обработчик: ПоказатьНезакрытые
        - Тип: Кнопка
          Команды:
            Тип: ОбычнаяКоманда
            Представление: Мои закрытые
            Обработчик: ПоказатьЗакрытые
      - Тип: Надпись
        Значение: ="Закрытый заказ — проведённый заказ клиента со статусом «Закрыт» в ERP. Суммы рассчитаны по условиям заказа, это не фактическая оплата. Статусы проверяются автоматически."
        Важность: Низкая
      - Тип: ПроизвольныйСписок<ИсточникДанныхМассив<СтрокаРынкаИгрока>>
        Имя: СписокЗаказов
        Источник:
          Данные: =Рынок
        ТипКомпонентаСтроки: КарточкаЗаказаИгрока
        ПриНажатииСтроки: ЗаказВыбран
        ИспользованиеПоиска: Ложь
        РастягиватьПоГоризонтали: Истина
        КонтейнерСтрок:
          Тип: Группа
          Компоновка: Матричная
          РастягиватьПоГоризонтали: Истина
          НастройкиМатричнойКомпоновки:
            АвтоЗаполнение: ДобавлятьКолонкиИСтроки
            ОписаниеАвтоматическихКолонок:
              МинимальнаяШирина: 260
              РастягиватьПоГоризонтали: Истина
            ОписаниеАвтоматическихСтрок:
              РастягиватьПоВертикали: Ложь
      - Тип: Надпись
        Значение: '=Состояние == Неопределено ? "Назначенный игрок увидит здесь рынок своей игры." : (Состояние!.ЗаказыПоЦенамERP ? "Заказ появится после завершения установки цен всеми командами и перехода ведущего к продажам." : (Состояние!.СвободныйРынок ? "Здесь пока
          нет заказов. Рынок пополняется в открытом этапе продаж." : "В игре включено автоматическое распределение. Для общего рынка создайте
          игру с разбором заказов командами."))'
        Видимость: =Рынок.Размер() == 0
        Важность: Низкая
      - Тип: СтандартнаяКарточка
        Заголовок: '=ВыбранныйЗаказ == Неопределено ? "Заказ" : "Заказ №%{ВыбранныйЗаказ!.Номер}"'
        Содержимое:
          Тип: Группа
          Компоновка: Вертикальная
          Содержимое:
          - Тип: Надпись
            Значение: '=ВыбранныйЗаказ == Неопределено ? "" : "%{ВыбранныйЗаказ!.Модель} · %{ВыбранныйЗаказ!.Количество} шт. · %{ВыбранныйЗаказ!.Сумма}
              ₽"'
          - Тип: Надпись
            Значение: '=ВыбранныйЗаказ == Неопределено ? "" : ВыбранныйЗаказ!.Описание'
          - Тип: Надпись
            Значение: '=ВыбранныйЗаказ == Неопределено ? "" : "Получатель: %{ВыбранныйЗаказ!.Команда}. %{ВыбранныйЗаказ!.Статус}"'
          - Тип: Надпись
            Значение: '=ВыбранныйЗаказ == Неопределено ? "" : ВыбранныйЗаказ!.СостояниеERP'
            Важность: Низкая
          - Тип: Кнопка
            Имя: ПолучитьКнопка
            Команды:
              Тип: ОбычнаяКоманда
              Представление: Получить заказ / повторить отправку
              Обработчик: ПолучитьЗаказ
              Доступность: =ВыбранныйЗаказ != Неопределено и ВыбранныйЗаказ!.МожноПолучить и не Занято
              Важность: Высокая
        РастягиватьПоГоризонтали: Истина
        Видимость: =ВыбранныйЗаказ != Неопределено
      - Тип: Группа
        Компоновка: Бенто
        РастягиватьПоГоризонтали: Истина
        Содержимое:
        - Тип: СтандартнаяКарточка
          Заголовок: Готовность вашей команды
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            Содержимое:
            - Тип: Надпись
              Значение: =ТекстГотовности
            - Тип: ПолеВвода<Строка>
              Имя: Комментарий
              Значение: =Комментарий
              Заголовок: Что сделано на этом этапе
              НастройкиВводаСтроки:
                Многострочная: Истина
              Доступность: =Состояние != Неопределено и Состояние!.МожноЗавершить и не Занято
            - Тип: Кнопка
              Имя: ГотовоКнопка
              Команды:
                Тип: ОбычнаяКоманда
                Представление: '=Фаза == ФазыИгры.Подготовка ? "Завершить подготовку" : "Завершить этап"'
                Обработчик: ЗавершитьЭтап
                Доступность: =Состояние != Неопределено и Состояние!.МожноЗавершить и не Занято
                Важность: Высокая
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Двойная
        - Тип: СтандартнаяКарточка
          Заголовок: Другие команды
          Содержимое:
            Тип: Таблица<ИсточникДанныхМассив<СтрокаКомандыИгрока>>
            Имя: ТаблицаКоманд
            Источник:
              Данные: =Команды
            РастягиватьПоГоризонтали: Истина
            Колонки:
            - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
              Заголовок: Команда
              ПолеЗначения: Команда
            - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
              Заголовок: Этап
              ПолеЗначения: Готовность
            - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
              Заголовок: Не закрыты
              ПолеЗначения: НезакрытыхЗаказов
            - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
              Заголовок: Закрыты
              ПолеЗначения: ЗакрытыхЗаказов
            - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
              Заголовок: Незакрытый портфель, ₽
              ПолеЗначения: НезакрытыйПортфель
            - Тип: СтандартнаяКолонкаТаблицы<СтрокаКомандыИгрока>
              Заголовок: Закрытый портфель, ₽
              ПолеЗначения: ЗакрытыйПортфель
          РастягиватьПоГоризонтали: Истина
          ШиринаВКолонках: Двойная
      - Тип: Надпись
        Значение: =Сообщение
        Видимость: =Сообщение != ""
      - Тип: Надпись
        Значение: =Обновлено
        Важность: Низкая
      РастягиватьПоГоризонтали: Истина
      ШиринаВКолонках: Четверная
