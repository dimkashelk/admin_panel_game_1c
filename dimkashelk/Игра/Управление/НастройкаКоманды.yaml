ВидЭлемента: КомпонентИнтерфейса
Ид: f36cece2-ffe7-4459-a77b-35c96b170e0f
Имя: НастройкаКоманды
ОбластьВидимости: ВПроекте
Импорт:
- Данные
- Обмен
Наследует:
  Тип: Форма<Булево>
  ВключатьВАвтоИнтерфейс: Ложь
  Заголовок: ="Настройка команды «" + НазваниеКоманды + "»"
  Содержимое:
    Тип: ПроизвольныйШаблонФормы
    Содержимое:
      Тип: Группа
      Компоновка: Вертикальная
      РастягиватьПоГоризонтали: Истина
      ШиринаВКолонках: Четверная
      Содержимое:
      - Тип: Надпись
        Значение: =Сообщение
        Видимость: =Сообщение != ""
      - Тип: Надпись
        Значение: ="Игроки и база будут сохранены вместе с игрой."
        Видимость: =СозданнаяИгра == Неопределено
      - Тип: Страницы
        РастягиватьПоГоризонтали: Истина
        ШиринаВКолонках: Четверная
        Страницы:
        - Тип: Страница
          Заголовок: Игроки команды
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            ШиринаВКолонках: Четверная
            Содержимое:
            - Тип: Таблица<ИсточникДанныхМассив<СтрокаИгрокаКоманды>>
              Имя: Игроки
              РастягиватьПоГоризонтали: Истина
              ШиринаВКолонках: Четверная
              ИспользоватьОтметкиСтрок: Истина
              Источник:
                Данные: =Игроки
              Колонки:
              - Тип: СтандартнаяКолонкаТаблицы<СтрокаИгрокаКоманды>
                Заголовок: Игрок
                ПолеЗначения: Пользователь
                НастройкиРедактирования:
                  Тип: НастройкиРедактированияПоляВвода
              Команды:
                Тип: ФрагментКомандногоИнтерфейса
                Элементы:
                - =Компоненты.Игроки.ДобавитьСтроку
              КомандыОтмеченныхСтрок:
                Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<Массив<СтрокаИгрокаКоманды>>>
                Элементы:
                - =Компоненты.Игроки.Удалить
              Доступность: =не Занято и Администратор
            - Тип: Надпись
              Значение: ="Управление игроками доступно администратору приложения."
              Видимость: =не Администратор
            - Тип: Надпись
              Значение: '=СозданнаяИгра == Неопределено ? "Выберите существующих игроков. Создать нового игрока
                можно здесь после создания игры." : "Новый игрок сразу получит доступ к выбранной команде."'
            - Тип: ПолеВвода<Строка>
              Имя: ЛогинИгрока
              Видимость: =СозданнаяИгра != Неопределено
              Заголовок: Логин нового игрока
              Значение: =ЛогинИгрока
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Доступность: =не Занято и Администратор
            - Тип: ПолеВвода<Строка>
              Имя: ПарольИгрока
              Видимость: =СозданнаяИгра != Неопределено
              Заголовок: Временный пароль (пусто — сгенерировать)
              Значение: =ПарольИгрока
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              РежимПароля: Истина
              Доступность: =не Занято и Администратор
            - Тип: Кнопка
              Имя: СоздатьИгрокаКнопка
              Видимость: =СозданнаяИгра != Неопределено
              Команды:
                Тип: ОбычнаяКоманда
                Представление: Создать игрока и добавить в команду
                Обработчик: СоздатьИгрока
              Доступность: =не Занято и Администратор
            - Тип: ПолеВвода<Строка>
              Имя: ВыданныйПароль
              Видимость: =СозданнаяИгра != Неопределено и ВыданныйПароль != ""
              Заголовок: Пароль созданного игрока — сохраните для первого входа
              Значение: =ВыданныйПароль
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              РежимПароля: Истина
              ТолькоЧтение: Истина
        - Тип: Страница
          Заголовок: База ERP команды
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            ШиринаВКолонках: Четверная
            Содержимое:
            - Тип: Надпись
              Значение: ="Игроки этой команды будут использовать подключение, сохранённое здесь."
            - Тип: ПолеВвода<Строка>
              Имя: АдресКоманды
              Заголовок: Адрес публикации ERP
              Значение: =АдресКоманды
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Доступность: =не Занято
              ПриИзменении: РеквизитыБазыИзменены
            - Тип: ПолеВвода<Строка>
              Имя: ЛогинКоманды
              Заголовок: Логин
              Значение: =ЛогинКоманды
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Доступность: =не Занято
              ПриИзменении: РеквизитыБазыИзменены
            - Тип: ПолеВвода<Строка>
              Имя: ПарольКоманды
              Заголовок: '=СозданнаяИгра == Неопределено ? "Пароль" : "Пароль (пусто — оставить сохранённый)"'
              Значение: =ПарольКоманды
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              РежимПароля: Истина
              Доступность: =не Занято
              ПриИзменении: ПарольКомандыИзменен
            - Тип: Кнопка
              Имя: ЗагрузитьОрганизацииКнопка
              Команды:
                Тип: ОбычнаяКоманда
                Представление: Загрузить организации
                Обработчик: ЗагрузитьОрганизации
              Доступность: =не Занято и АдресКоманды != "" и ЛогинКоманды != ""
            - Тип: ПолеВвода<Строка>
              Имя: ОрганизацияКоманды
              Заголовок: Организация
              Значение: =ОрганизацияКоманды
              СписокВыбора: =ВыборОрганизаций()
              РежимВыбораИзСписка: ТолькоЗначенияИзСпискаВыбора
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Доступность: =не Занято и не Организации.Пусто()
              Видимость: =не Организации.Пусто() или ОрганизацияКоманды != ""
            - Тип: Флажок
              Имя: ПодключениеАктивно
              Заголовок: Подключение активно
              Значение: =ПодключениеАктивно
              Доступность: =не Занято
            - Тип: Надпись
              Значение: =СостояниеПодключения
            - Тип: Кнопка
              Имя: ПодготовкаБазыКнопка
              Видимость: =СозданнаяИгра != Неопределено
              Команды:
                Тип: ОбычнаяКоманда
                Представление: Подготовить или проверить базу
                Обработчик: ПодготовкаБазы
              Доступность: =не Занято и ПодключениеERP != Неопределено
  ОсновнаяКоманда:
    Тип: ОбычнаяКоманда
    Представление: Готово
    Обработчик: Готово
    Доступность: =не Занято
  ПовторноеИспользованиеФормы: Ложь
