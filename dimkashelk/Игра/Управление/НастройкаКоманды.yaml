ВидЭлемента: КомпонентИнтерфейса
Ид: f36cece2-ffe7-4459-a77b-35c96b170e0f
Имя: НастройкаКоманды
ОбластьВидимости: ВПроекте
Импорт:
- Данные
- Обмен
Наследует:
  Тип: Форма
  ВключатьВАвтоИнтерфейс: Ложь
  Заголовок: ="Настройка команды «" + НазваниеКоманды + "»"
  Содержимое:
    Тип: ПроизвольныйШаблонФормы
    Содержимое:
      Тип: Группа
      Компоновка: Вертикальная
      РастягиватьПоГоризонтали: Истина
      ШиринаВКолонках: Четверная
      Содержимое:
      - Тип: Надпись
        Значение: =Сообщение
        Видимость: =Сообщение != ""
      - Тип: Надпись
        Значение: ="Игроки и база будут сохранены вместе с игрой."
        Видимость: =СозданнаяИгра == Неопределено
      - Тип: Страницы
        РастягиватьПоГоризонтали: Истина
        ШиринаВКолонках: Четверная
        Страницы:
        - Тип: Страница
          Заголовок: Игроки команды
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            ШиринаВКолонках: Четверная
            Содержимое:
            - Тип: Надпись
              Значение: =СписокПользователей
            - Тип: СворачиваемыйКомпонент
              Заголовок: Добавить существующего игрока
              Свернут: =ИгрокиСвернуты
              РастягиватьПоГоризонтали: Истина
              Содержимое:
                Тип: Группа
                Компоновка: Вертикальная
                РастягиватьПоГоризонтали: Истина
                ШиринаВКолонках: Четверная
                Содержимое:
                - Тип: ПолеВвода<Пользователи.Ссылка?>
                  Имя: Пользователь
                  Заголовок: Пользователь
                  Значение: =Пользователь
                  РастягиватьПоГоризонтали: Истина
                  МаксимальнаяШирина: 560
                  Доступность: =не Занято
                - Тип: Кнопка
                  Имя: ДобавитьИгрокаКнопка
                  Команды:
                    Тип: ОбычнаяКоманда
                    Представление: Добавить в команду
                    Обработчик: ДобавитьИгрока
                  Доступность: =не Занято и Пользователь != Неопределено и Администратор
                - Тип: Кнопка
                  Имя: ОтключитьИгрокаКнопка
                  Команды:
                    Тип: ОбычнаяКоманда
                    Представление: '=СозданнаяИгра == Неопределено ? "Убрать из команды" : "Отключить от команды"'
                    Обработчик: ОтключитьИгрока
                  Доступность: =не Занято и Пользователь != Неопределено и Администратор
            - Тип: Надпись
              Значение: '=СозданнаяИгра == Неопределено ? "Выберите существующих игроков. Создать нового игрока можно здесь после создания игры." : "Новый игрок сразу получит доступ к выбранной команде."'
            - Тип: ПолеВвода<Строка>
              Имя: ЛогинИгрока
              Видимость: =СозданнаяИгра != Неопределено
              Заголовок: Логин нового игрока
              Значение: =ЛогинИгрока
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Доступность: =не Занято
            - Тип: ПолеВвода<Строка>
              Имя: ПарольИгрока
              Видимость: =СозданнаяИгра != Неопределено
              Заголовок: Временный пароль (пусто — сгенерировать)
              Значение: =ПарольИгрока
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              РежимПароля: Истина
              Доступность: =не Занято
            - Тип: Кнопка
              Имя: СоздатьИгрокаКнопка
              Видимость: =СозданнаяИгра != Неопределено
              Команды:
                Тип: ОбычнаяКоманда
                Представление: Создать игрока и добавить в команду
                Обработчик: СоздатьИгрока
              Доступность: =не Занято и Администратор
            - Тип: ПолеВвода<Строка>
              Имя: ВыданныйПароль
              Видимость: =СозданнаяИгра != Неопределено и ВыданныйПароль != ""
              Заголовок: Пароль созданного игрока — сохраните для первого входа
              Значение: =ВыданныйПароль
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              РежимПароля: Истина
              ТолькоЧтение: Истина
        - Тип: Страница
          Заголовок: База ERP команды
          Содержимое:
            Тип: Группа
            Компоновка: Вертикальная
            РастягиватьПоГоризонтали: Истина
            ШиринаВКолонках: Четверная
            Содержимое:
            - Тип: Надпись
              Значение: ="Игроки этой команды будут использовать подключение, сохранённое
                здесь."
            - Тип: ПолеВвода<Строка>
              Имя: АдресКоманды
              Заголовок: HTTPS-адрес публикации ERP / OData
              Значение: =АдресКоманды
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Доступность: =не Занято
            - Тип: ПолеВвода<Строка>
              Имя: ОрганизацияКоманды
              Заголовок: Организация команды в ERP
              Значение: =ОрганизацияКоманды
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Доступность: =не Занято
            - Тип: ПолеВвода<Строка>
              Имя: ЛогинКоманды
              Заголовок: Логин OData
              Значение: =ЛогинКоманды
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              Доступность: =не Занято
            - Тип: ПолеВвода<Строка>
              Имя: ПарольКоманды
              Заголовок: '=СозданнаяИгра == Неопределено ? "Пароль OData" : "Пароль OData (пусто — оставить сохранённый)"'
              Значение: =ПарольКоманды
              РастягиватьПоГоризонтали: Истина
              МаксимальнаяШирина: 560
              РежимПароля: Истина
              Доступность: =не Занято
            - Тип: Флажок
              Имя: ПодключениеАктивно
              Заголовок: Подключение активно
              Значение: =ПодключениеАктивно
              Доступность: =не Занято
            - Тип: Надпись
              Значение: =СостояниеПодключения
            - Тип: Кнопка
              Имя: СохранитьБазуКнопка
              Команды:
                Тип: ОбычнаяКоманда
                Представление: Сохранить базу команды
                Обработчик: СохранитьБазу
              Доступность: =не Занято
            - Тип: Кнопка
              Имя: ПодготовкаБазыКнопка
              Видимость: =СозданнаяИгра != Неопределено
              Команды:
                Тип: ОбычнаяКоманда
                Представление: Подготовить или проверить базу
                Обработчик: ПодготовкаБазы
              Доступность: =не Занято и ПодключениеERP != Неопределено
            - Тип: Надпись
              Значение: ="Подготовка и чтение базы через OData доступны без расширения.
                Полный цикл обычной игры требует расширение обмена ERP."
      - Тип: Кнопка
        Имя: ГотовоКнопка
        Команды:
          Тип: ОбычнаяКоманда
          Представление: Готово
          Обработчик: Готово
        Доступность: =не Занято
